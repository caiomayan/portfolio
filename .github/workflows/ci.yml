name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Fixo em 24.04, que o Playwright suporta oficialmente (decisão do coordenador). Não resolve a falha do apt (o DNS dos espelhos do Ubuntu falha no runner, nas imagens 24.04 e 26.04): isso é tratado no passo de dependências do sistema, abaixo.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # PR vindo de fork não recebe secrets: só nesse caso o teste de termos proibidos é pulado, com aviso.
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aviso (PR de fork)
        if: env.FORK_PR == 'true'
        run: echo "::warning::PR de fork não tem acesso ao secret FORBIDDEN_TERMS; o teste de termos proibidos foi pulado."

      # O GitHub só mascara o secret inteiro; aqui cada termo vira uma máscara própria, pra nenhum aparecer no log.
      # O segredo fica só neste passo e no do `npm test` (não no job inteiro): o `npm ci` e os scripts de instalação dos pacotes não o enxergam.
      # Sem `if`: o `if` do passo não enxerga o `env` do próprio passo; segredo vazio só não gera máscara. O trim é em bash puro e o termo é mascarado exatamente como está (sem xargs, que mexe em aspas e barra invertida). Nunca imprime o termo.
      - name: Mascarar cada termo proibido
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          IFS='|' read -ra parts <<< "$FORBIDDEN_TERMS"
          for p in "${parts[@]}"; do
            p="${p#"${p%%[![:space:]]*}"}"
            p="${p%"${p##*[![:space:]]}"}"
            if [ -n "$p" ]; then echo "::add-mask::$p"; fi
          done

      # Procura cada termo em todos os arquivos versionados (código, testes, comentários, docs), não só no site renderizado.
      # O log mostra só arquivo e linha, nunca o termo. O segredo fica só neste passo, no de máscara e no dos testes.
      - name: Termos proibidos no código
        run: npm run check:terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

      - name: Teste da verificação de termos (termo inventado)
        run: npm run test:terms

      - name: Testes das buscas de dados ao vivo (sem token, API fora)
        run: npm run test:dados

      - name: Testes da escolha de idioma (#46)
        run: npm run test:idioma

      - run: npm run typecheck
      - run: npm run lint

      # Dados ao vivo (#28): o build lê o Open-Meteo e o GitHub de variáveis de ambiente. Nos testes elas apontam pra um servidor falso
      # local (tests/fixtures/apis.mjs), então o resultado não depende da rede nem do token de verdade (o token abaixo é só do falso, não é segredo).
      # Dois builds: um com as APIs respondendo (.next) e um com as duas falhando (.next-falha). O servidor falso só vive durante os builds
      # (a página já sai pronta do build); o Playwright sobe o dele no passo dos testes.
      - name: Builds (APIs respondendo e APIs falhando)
        run: |
          node tests/fixtures/apis.mjs > /dev/null 2>&1 &
          MOCK_PID=$!
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3199/health > /dev/null && break; sleep 0.5; done
          ALLOW_TEST_API_URLS=1 OPEN_METEO_URL=http://127.0.0.1:3199/weather GITHUB_GRAPHQL_URL=http://127.0.0.1:3199/github GITHUB_TOKEN=token-de-teste-nao-e-segredo npm run build
          NEXT_DIST_DIR=.next-falha ALLOW_TEST_API_URLS=1 OPEN_METEO_URL=http://127.0.0.1:3199/weather-erro GITHUB_GRAPHQL_URL=http://127.0.0.1:3199/github-erro GITHUB_TOKEN=token-de-teste-nao-e-segredo npm run build
          kill $MOCK_PID

      - name: Versão do Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache dos navegadores do Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # O navegador é obrigatório: se o download falhar, o CI falha.
      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # As libs do sistema vêm de apt, que no runner está sem resolver o DNS dos espelhos do Ubuntu (visto nas imagens 24.04 e 26.04).
      # As imagens do GitHub já trazem as libs do Chrome; se faltar alguma, os testes quebram de forma visível. Por isso só este passo
      # não derruba o CI: avisa e segue. Nenhum erro de verdade fica escondido.
      - name: Instalar dependências do sistema (não fatal)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if ! npx playwright install-deps chromium; then
            echo "::warning::npx playwright install-deps falhou (apt do runner sem rede). Seguindo com as libs que a imagem já traz; se faltar alguma, os testes falham."
            exit 1
          fi

      - name: Testes
        run: npm test
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  # Lighthouse (#45): job separado, em paralelo com o `test`, contra o build de produção (`next start`). Mediana de 3 execuções por página
  # (mobile, o padrão do Lighthouse), notas mínimas em lighthouserc.json. Sem upload público: o relatório vai como artifact.
  # O nome do job (`lighthouse`) deve ficar estável: vai virar check obrigatório.
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mesmo servidor falso do `test`: o build lê o Open-Meteo e o GitHub dele, então a nota não depende da rede nem do token (o token abaixo é só do falso).
      - name: Build (APIs falsas)
        run: |
          node tests/fixtures/apis.mjs > /dev/null 2>&1 &
          MOCK_PID=$!
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3199/health > /dev/null && break; sleep 0.5; done
          ALLOW_TEST_API_URLS=1 OPEN_METEO_URL=http://127.0.0.1:3199/weather GITHUB_GRAPHQL_URL=http://127.0.0.1:3199/github GITHUB_TOKEN=token-de-teste-nao-e-segredo npm run build
          kill $MOCK_PID

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      # Mediana das 4 notas por URL no resumo do job, pra calibrar os mínimos sem baixar o artifact.
      - name: Resumo do Lighthouse
        if: always()
        run: |
          node -e "
          const fs=require('fs');
          if(!fs.existsSync('.lighthouseci/manifest.json')){process.exit(0)}
          const m=JSON.parse(fs.readFileSync('.lighthouseci/manifest.json','utf8'));
          const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
          const cats=['performance','accessibility','seo','best-practices'];
          let out='## Lighthouse (mediana de '+m.length/new Set(m.map(r=>r.url)).size+' execuções por URL)\n\n| URL | desempenho | acessibilidade | SEO | boas práticas |\n|---|---|---|---|---|\n';
          for(const u of new Set(m.map(r=>r.url))){const rs=m.filter(r=>r.url===u);out+='| '+u+' | '+cats.map(k=>med(rs.map(r=>r.summary[k]))).join(' | ')+' |\n'}
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
          console.log(out);
          "

      - name: Relatório do Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true # .lighthouseci é pasta oculta; sem isso o artifact sai vazio
          if-no-files-found: ignore
